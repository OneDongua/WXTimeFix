plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.onedongua.wxtimefix'
    compileSdk 37

    defaultConfig {
        applicationId "com.onedongua.wxtimefix"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
}